# Common administrative preparation topics (FR-5.1)
# Owner: Product Manager. Changes need PM review and a decision-log entry.
# Used to find "Ask the clinic" items: any topic NOT covered (with a verified
# citation) in the patient's documents becomes a question to ask the clinic.
# Wording rule: questions only. Never state what the answer is. No medical advice.

version: 2
topics:
- id: photo_id
  name: Photo ID
  ask_the_clinic: Do I need to bring a photo ID?
  covered_when: The documents tell the patient to bring a photo ID or identification.
- id: insurance_card
  name: Insurance card
  ask_the_clinic: Do I need to bring my insurance card?
  covered_when: The documents tell the patient to bring an insurance card.
- id: referral_on_file
  name: Referral on file
  ask_the_clinic: Is my referral on file with the clinic?
  covered_when: The documents say the referral has been received or is on file at the specialist's clinic. A referral letter
    existing does NOT count.
- id: previous_records
  name: Previous test results or records
  ask_the_clinic: Should I bring results from previous tests or other doctors?
  covered_when: The documents tell the patient to bring previous test results, imaging, reports, or records.
- id: medication_list
  name: Medication list
  ask_the_clinic: Should I bring a list of my current medications?
  covered_when: The documents tell the patient to bring a list of medications or the medications themselves. An instruction
    to stop or take a medicine does NOT count.
- id: test_preparation
  name: Test preparation
  ask_the_clinic: Do any of my tests need preparation, such as not eating beforehand?
  covered_when: The documents give preparation steps for a test or procedure (for example fasting or stopping a medicine).
    Bringing previous results does NOT count.
- id: arrival_time
  name: Arrival time
  ask_the_clinic: How early should I arrive?
  covered_when: The documents say how early to arrive or when to check in. The appointment time alone does NOT count.
- id: location_parking
  name: Location and parking
  ask_the_clinic: Where exactly is the clinic, and where should I park?
  covered_when: The documents give the clinic's address, building, floor, or parking information.
- id: forms
  name: Forms to complete
  ask_the_clinic: Are there forms I need to complete before my visit?
  covered_when: The documents tell the patient to complete forms BEFORE the visit. Paperwork done at the clinic does NOT count.
- id: reschedule_cancel
  name: Rescheduling or cancelling
  ask_the_clinic: How do I reschedule or cancel if I need to?
  covered_when: The documents say how to reschedule or cancel.
